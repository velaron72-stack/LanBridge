name: Build (APK + PC)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key (created only if the repository has none)
        run: |
          if [ ! -f keystore/lanbridge.p12 ]; then
            mkdir -p keystore
            keytool -J-Dkeystore.pkcs12.legacy -genkeypair -storetype PKCS12 \
              -keystore keystore/lanbridge.p12 -alias lanbridge \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass lanbridge -keypass lanbridge \
              -dname "CN=LanBridge, O=LanBridge, C=XX"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanBridge-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  native-tests:
    name: Native core tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run native self-test
        run: bash native-tests/run.sh
      - name: Run real-kernel traffic test (TUN devices in network namespaces)
        run: sudo env "PATH=$PATH" python3 native-tests/nettest.py all

  pc-native:
    name: PC native library (lanbridge.dll)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLVM_MINGW_TAG: "20241030"
      LLVM_MINGW_NAME: llvm-mingw-20241030-ucrt-ubuntu-20.04-x86_64
      LLVM_MINGW_SHA256: 05c55108e9b400bda1d4cef8e22c0e5f9495f1316c072e92b9f7965114a30b66
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (JNI headers)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install llvm-mingw (pinned, checksum verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${LLVM_MINGW_NAME}.tar.xz"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/${LLVM_MINGW_NAME}" >> "$GITHUB_ENV"

      - name: Build lanbridge.dll
        run: |
          set -euo pipefail
          cmake -S app/src/main/cpp -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/app/src/main/cpp/toolchain-mingw-x64.cmake" -DLLVM_MINGW="$LLVM_MINGW"
          cmake --build build-win
          "$LLVM_MINGW/bin/llvm-strip" --strip-unneeded build-win/lanbridge.dll
          ls -l build-win/lanbridge.dll

      - name: Check the library (exports, dependencies)
        run: |
          set -euo pipefail
          OBJDUMP="$LLVM_MINGW/bin/llvm-objdump"
          "$OBJDUMP" -p build-win/lanbridge.dll > build-win/pe.txt
          grep -E "DLL Name" build-win/pe.txt | sort -u
          # every external fun of Native.kt and WinTun.kt must be exported
          want=$(cat app/src/main/java/app/lanbridge/core/Native.kt desktop/src/main/kotlin/app/lanbridge/core/WinTun.kt | grep -c "external fun")
          have=$(grep -c "Java_app_lanbridge_core_" build-win/pe.txt || true)
          echo "JNI exports: have=$have want=$want"
          test "$have" -ge "$want"
          # a static build: only Windows system libraries may be imported
          if grep -iE "DLL Name: (libc\+\+|libunwind|libwinpthread|libgcc|libstdc\+\+)" build-win/pe.txt; then
            echo "lanbridge.dll depends on a runtime library that is not shipped"; exit 1
          fi

      - name: Upload lanbridge.dll
        uses: actions/upload-artifact@v4
        with:
          name: lanbridge-dll
          path: build-win/lanbridge.dll
          if-no-files-found: error

  # Separate job: installing Wine takes minutes and must not hold up the PC build (pc-app waits only for pc-native).
  wine-tests:
    name: Core tests under Wine (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    env:
      LLVM_MINGW_TAG: "20241030"
      LLVM_MINGW_NAME: llvm-mingw-20241030-ucrt-ubuntu-20.04-x86_64
      LLVM_MINGW_SHA256: 05c55108e9b400bda1d4cef8e22c0e5f9495f1316c072e92b9f7965114a30b66
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${LLVM_MINGW_NAME}.tar.xz"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/${LLVM_MINGW_NAME}" >> "$GITHUB_ENV"

      - name: Run the tests under Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 || sudo apt-get install -y -qq wine
          export WINEPREFIX="$RUNNER_TEMP/wineprefix" WINEDEBUG=-all
          export WINE="$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)"
          bash native-tests/run-win.sh all

  pc-app:
    name: PC app (Windows 10/11 x64)
    needs: pc-native
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Get lanbridge.dll
        uses: actions/download-artifact@v4
        with:
          name: lanbridge-dll
          path: desktop/resources/windows-x64

      - name: Get Wintun 0.14.1 (the signature must be WireGuard LLC)
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Write-Host ('wintun-0.14.1.zip sha256: ' + (Get-FileHash $zip -Algorithm SHA256).Hash)
          $dir = Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive $zip -DestinationPath $dir
          $dll = Join-Path $dir 'wintun\bin\amd64\wintun.dll'
          $sig = Get-AuthenticodeSignature $dll
          Write-Host ('signature: ' + $sig.Status + ', ' + $sig.SignerCertificate.Subject)
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'WireGuard LLC') {
            throw 'wintun.dll: signature is not a valid WireGuard LLC signature'
          }
          Copy-Item $dll 'desktop\resources\windows-x64\wintun.dll'
          Copy-Item (Join-Path $dir 'wintun\LICENSE.txt') 'desktop\resources\windows-x64\wintun-LICENSE.txt'
          Get-ChildItem 'desktop\resources\windows-x64'

      - name: Build the app image
        working-directory: desktop
        run: gradle checkNativeFiles createDistributable --no-daemon --stacktrace

      - name: Both libraries must be inside the app image
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'desktop\build\compose\binaries\main\app\LanBridge'
          foreach ($n in 'LanBridge.exe', 'lanbridge.dll', 'wintun.dll') {
            $f = Get-ChildItem $root -Recurse -Filter $n | Select-Object -First 1
            if (-not $f) { throw "$n is not in $root" }
            Write-Host ("$n -> " + $f.FullName)
          }

      - name: Smoke test of the packaged app (libraries load, engine answers)
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'desktop\build\compose\binaries\main\app\LanBridge\LanBridge.exe'
          $out = Join-Path $env:RUNNER_TEMP 'check.txt'
          $p = Start-Process $exe -ArgumentList '--check', '--check-out', $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'no report written' }
          if ($p.ExitCode -ne 0) { throw ('smoke test failed, exit code ' + $p.ExitCode) }

      - name: Wintun adapter test on the runner (non-blocking)
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'desktop\build\compose\binaries\main\app\LanBridge\LanBridge.exe'
          $out = Join-Path $env:RUNNER_TEMP 'check-adapter.txt'
          $p = Start-Process $exe -ArgumentList '--check', '--check-adapter', '--check-out', $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'no report written' }
          if ($p.ExitCode -ne 0) { throw ('adapter test failed, exit code ' + $p.ExitCode) }

      - name: Portable ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'desktop\build\compose\binaries\main\app\LanBridge' -DestinationPath 'LanBridge-PC-portable.zip'
          Get-Item 'LanBridge-PC-portable.zip' | Select-Object Name, Length

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: LanBridge-PC-portable
          path: LanBridge-PC-portable.zip
          if-no-files-found: error

      - name: WiX Toolset 3 (jpackage needs it for the .exe installer)
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Wix {
            $c = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($c) { return (Split-Path $c.Source) }
            $d = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($d -and (Test-Path (Join-Path $d.FullName 'bin\candle.exe'))) { return (Join-Path $d.FullName 'bin') }
            return $null
          }
          $bin = Find-Wix
          if (-not $bin) {
            choco install wixtoolset -y --no-progress
            $bin = Find-Wix
          }
          if (-not $bin) { throw 'WiX Toolset 3 not found' }
          Write-Host "WiX: $bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Build the installer (one .exe)
        working-directory: desktop
        run: gradle packageExe --no-daemon --stacktrace

      - name: Installer file
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'desktop\build\compose\binaries\main\exe' -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'the installer .exe was not built' }
          Get-Item $exe.FullName | Select-Object Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LanBridge-Setup
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Silent install and smoke test of the installed app (non-blocking)
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem 'desktop\build\compose\binaries\main\exe' -Filter *.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList '/quiet' -Wait -PassThru
          Write-Host ('installer exit code: ' + $p.ExitCode)
          $dir = 'C:\Program Files\LanBridge'
          $app = Join-Path $dir 'LanBridge.exe'
          if (-not (Test-Path $app)) { throw "not installed: $app" }
          foreach ($n in 'lanbridge.dll', 'wintun.dll') {
            if (-not (Get-ChildItem $dir -Recurse -Filter $n)) { throw "$n is missing in $dir" }
          }
          $out = Join-Path $env:RUNNER_TEMP 'check-installed.txt'
          $q = Start-Process $app -ArgumentList '--check', '--check-out', $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($q.ExitCode -ne 0) { throw ('installed app check failed, exit code ' + $q.ExitCode) }
