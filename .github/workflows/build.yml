name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key (created only if the repository has none)
        run: |
          if [ ! -f keystore/lanbridge.p12 ]; then
            mkdir -p keystore
            keytool -J-Dkeystore.pkcs12.legacy -genkeypair -storetype PKCS12 \
              -keystore keystore/lanbridge.p12 -alias lanbridge \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass lanbridge -keypass lanbridge \
              -dname "CN=LanBridge, O=LanBridge, C=XX"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanBridge-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  native-tests:
    name: Native core tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run native self-test
        run: bash native-tests/run.sh
